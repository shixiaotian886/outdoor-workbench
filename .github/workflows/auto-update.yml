name: 自动更新 BGM + 违禁词

on:
  schedule:
    # 每周一早上 9 点（北京时间）自动运行
    - cron: '0 1 * * 1'  # UTC 1:00 = 北京时间 9:00
  workflow_dispatch:  # 也支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 commit
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🔄 运行更新脚本
        run: python scripts/auto-update.py
      
      - name: 📝 检查是否有变更
        id: check_changes
        run: |
          if git diff --quiet cloud-config/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "无变更，跳过 commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "检测到变更，准备 commit"
          fi
      
      - name: 💾 提交变更
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud-config/
          git commit -m "🔄 自动更新 BGM+违禁词 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
          git push
      
      - name: ✅ 完成
        run: echo "更新完成！APP 端下次打开会自动同步最新数据。"
